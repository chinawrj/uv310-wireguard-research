name: Offline Cortex-M3 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LLVM_CLANG: /usr/bin/clang-18
      LLVM_LD: /usr/bin/ld.lld-18
      QEMU_ARM: /usr/bin/qemu-system-arm
    steps:
      - name: Check out public sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify publication
        run: make verify
      - name: Install offline build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 libclang-rt-18-dev lld-18 qemu-system-arm python3-venv
          python3 -m venv "$RUNNER_TEMP/uv310-venv"
          "$RUNNER_TEMP/uv310-venv/bin/python" -m pip install -r requirements-test.txt
          echo "$RUNNER_TEMP/uv310-venv/bin" >> "$GITHUB_PATH"
      - name: Record build environment
        run: python3 tools/ci_environment.py
      - name: Replay successful historical branch
        run: make test-live
      - name: Replay memory-observation branch
        run: make test
      - name: Validate allocation retry and nonce lifecycle
        run: make test-pressure
      - name: Validate DHCP DNS transformer with sanitizers
        run: make test-dhcp-dns
      - name: Validate native DHCP and DNS integration
        run: make test-dns
      - name: Validate bounded DHCP growth with sanitizers
        run: make test-dhcp-growth
      - name: Validate native bounded DHCP growth
        run: make test-dns-grow
      - name: Validate LTO native adapter (1024-byte fixture pool)
        run: make test-dns-grow-lto
      - name: Validate LTO native adapter and exhausted 256-byte pool
        run: make test-dns-grow-lto-compact
      - name: Validate control-layer noinline and safe ICF profile
        run: make test-control-icf
      - name: Validate mocked status observer
        run: make test-observer
      - name: Compile resource comparisons
        run: |
          python3 tools/stack_audit.py --branch rekey-memory
          python3 tools/stack_audit.py --branch rekey-pressure
          python3 tools/compare_native_size.py
          python3 tools/stack_audit.py --branch rekey-dns
          python3 tools/compare_dns_size.py
          python3 tools/stack_audit.py --branch rekey-dns-grow
      - name: Report native layout constraints (over-budget candidates included)
        run: make audit-layout
      - name: Audit final linked stack frames
        run: make audit-linked-stack
      - name: Compare LTO inlining and folding profiles
        run: make audit-inline-profiles
      - name: Validate committed N1 telemetry candidate
        run: make test-dns-observe
      - name: Keep JSON evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: offline-linux-evidence
          path: .test-results/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
